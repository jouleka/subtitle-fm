[project]
name = "subtitle-worker"
version = "0.0.0"
description = "ASR + translation worker for Subtitle.fm"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "demucs>=4.0.1",
    "scenedetect[opencv]>=0.6.5",
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.1",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "rq>=2.0.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
# Only needed when running as a RunPod serverless container.
# Kept out of the default install so local dev doesn't pull it.
runpod = [
    "runpod>=1.7.0",
]
# OpenAI as an alternative translate provider — useful when you have an
# OpenAI key but not an Anthropic one (e.g. for local pipeline testing).
openai = [
    "openai>=1.50.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
