services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: subtitle-fm-postgres
    environment:
      POSTGRES_USER: subtitle_fm
      POSTGRES_PASSWORD: subtitle_fm
      POSTGRES_DB: subtitle_fm
    ports:
      # 5433 (not 5432) to coexist with a locally-installed Postgres.
      # Match in .env DATABASE_URL.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U subtitle_fm']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: subtitle-fm-redis
    ports:
      # 6380 (not 6379) to coexist with a locally-installed Redis.
      # Match in .env REDIS_URL.
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
