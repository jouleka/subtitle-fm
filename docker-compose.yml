services:
  postgres:
    image: postgres:16-alpine
    container_name: subtitle-fm-postgres
    environment:
      POSTGRES_USER: subtitle_fm
      POSTGRES_PASSWORD: subtitle_fm
      POSTGRES_DB: subtitle_fm
    ports:
      # 5433 (not 5432) to coexist with a locally-installed Postgres.
      # Match in .env DATABASE_URL.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U subtitle_fm']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subtitle-fm-redis
    ports:
      # 6380 (not 6379) to coexist with a locally-installed Redis.
      # Match in .env REDIS_URL.
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
