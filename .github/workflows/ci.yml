name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: subtitle_fm
          POSTGRES_PASSWORD: subtitle_fm
          POSTGRES_DB: subtitle_fm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subtitle_fm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://subtitle_fm:subtitle_fm@127.0.0.1:5432/subtitle_fm
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      WEB_URL: http://localhost:5173
      COLLAB_SECRET: ci-only-collab-secret-not-for-production
      WORKER_WEBHOOK_SECRET: ci-only-worker-secret-not-for-production
      LEMONSQUEEZY_WEBHOOK_SECRET: ci-only-lemon-secret-not-for-production
      API_PUBLIC_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3000
      PUBLIC_COLLAB_URL: ws://localhost:1234
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply database migrations
        run: bun run db:migrate
      - name: Type-check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Audit dependencies
        run: bun run audit

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.24'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --project apps/worker --extra dev --frozen
      - name: Lint
        run: uv run --project apps/worker ruff check apps/worker
      - name: Type-check
        run: uv run --project apps/worker mypy apps/worker/src
      - name: Test
        run: uv run --project apps/worker pytest apps/worker/tests
      - name: Audit dependencies
        run: |
          uv export --project apps/worker --frozen --no-dev --extra runpod --extra openai --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/worker-requirements.txt"
          uvx pip-audit -r "${RUNNER_TEMP}/worker-requirements.txt"
